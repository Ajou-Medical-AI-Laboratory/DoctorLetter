<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="닥터레터" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>닥터레터</title>
    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 프로덕션 빌드에서만 Service Worker 등록 (dev에서는 캐시 충돌 방지)
      if ('serviceWorker' in navigator && location.hostname !== 'localhost' && !location.hostname.match(/^127\./) && !location.hostname.match(/^\d+\.\d+\.\d+\.\d+$/)) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
